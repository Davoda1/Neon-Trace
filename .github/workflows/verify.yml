name: Native builds and focused checks

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev libvulkan1 mesa-vulkan-drivers
      - name: Install stable pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Windows SDK resource compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Formatting
        run: cargo fmt --check
      - name: Packaging regression checks
        run: python -m unittest discover -s tools -p "test_package.py" -v
      - name: Focused unit tests
        run: cargo test --release --locked
      - name: Native release executable
        run: cargo build --release --locked
      - name: Verify complete source distribution
        if: runner.os == 'Linux'
        run: python tools/package.py --verify-source-build
      - name: Verify official live data services
        if: runner.os == 'Linux'
        run: ./target/release/neontrace --verify-data
      - name: Linux native interface and exports
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb dbus-x11 imagemagick tesseract-ocr python3-venv python3-pil libxtst6
          /usr/bin/python3 -m venv --system-site-packages /tmp/neontrace-qa-env
          /tmp/neontrace-qa-env/bin/pip install dbus-next==0.2.3
          /tmp/neontrace-qa-env/bin/python tools/ui_smoke.py target/release/neontrace --out ui-qa
      - name: Windows native interface and OS preference
        if: runner.os == 'Windows'
        run: python tools/windows_ui_smoke.py --exe target/release/neontrace.exe --output windows-ui-qa
      - name: Download locked crate notice sources
        run: cargo fetch --locked
      - name: Collect compiled dependency notices
        run: python tools/dependency_notices.py
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          ldd target/release/neontrace > native-dependencies.txt
          readelf --version-info target/release/neontrace >> native-dependencies.txt
      - name: Windows runtime imports
        if: runner.os == 'Windows'
        shell: cmd
        run: dumpbin /dependents target\release\neontrace.exe > native-dependencies.txt
      - name: Retain interface verification
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: neontrace-interface-verification
          path: ui-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain Windows interface verification
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: neontrace-windows-interface-verification
          path: windows-ui-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain native build
        uses: actions/upload-artifact@v4
        with:
          name: neontrace-${{ runner.os }}
          path: |
            target/release/neontrace
            target/release/neontrace.exe
            docs/THIRD-PARTY-NOTICES.txt
            native-dependencies.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Package and publish release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Expected a stable semantic version'
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and Cargo version differ'
          assert Path(f'docs/releases/{version}.md').is_file(), 'Release notes are missing'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_VERSION={version}\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: neontrace-Linux
          path: native/linux
      - uses: actions/download-artifact@v4
        with:
          name: neontrace-Windows
          path: native/windows
      - name: Package native executables and complete source
        run: |
          cp native/linux/docs/THIRD-PARTY-NOTICES.txt docs/THIRD-PARTY-NOTICES.txt
          python tools/package.py \
            --linux native/linux/target/release/neontrace \
            --windows native/windows/target/release/neontrace.exe \
            --version "$RELEASE_VERSION" --output dist
          cd dist
          sha256sum --check SHA256SUM.txt
      - name: Upload complete draft release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft.txt 2>/dev/null; then
            if [ "$(cat release-draft.txt)" != "true" ]; then
              echo "This release is already published; keeping its existing assets."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "NeonTrace $RELEASE_VERSION" \
              --notes-file "docs/releases/$RELEASE_VERSION.md"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {p.name: p.stat().st_size for p in Path('dist').iterdir() if p.is_file()}
          actual = {a['name']: a['size'] for a in json.loads(Path('release-assets.json').read_text())['assets']}
          assert len(expected) == 8 and actual == expected, 'Uploaded release assets are incomplete'
          PY
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Fast-forward master when permitted
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git
          git fetch origin master
          release_commit="$(git rev-parse HEAD)"
          master_commit="$(git rev-parse origin/master)"
          if [ "$master_commit" != "$release_commit" ]; then
            if ! git merge-base --is-ancestor "$master_commit" "$release_commit"; then
              echo "::warning::master has advanced beyond this release; it will not be overwritten."
              echo "master was not changed because it has advanced beyond the release commit." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if ! git push origin "$release_commit:refs/heads/master"; then
              echo "::warning::master promotion needs a maintainer with the required repository permissions."
              echo "The tested tag is ready. A maintainer must fast-forward master to $release_commit using the repository's required permissions." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
      - name: Publish validated release
        if: steps.assets.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
