[package]
name = "neontrace"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["davoda1"]
description = "Native visual ping and observed network route explorer"
repository = "https://github.com/Davoda1/Neon-Trace"
build = "build.rs"

[dependencies]
iced = { version = "=0.14.0", features = ["canvas", "tokio", "advanced"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
url = "2.5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
maxminddb = { version = "=0.24.0", features = ["mmap"] }
flate2 = "1.1"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
csv = "1.3"
png = "0.17"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
debug = 0
strip = true
lto = false
codegen-units = 16

